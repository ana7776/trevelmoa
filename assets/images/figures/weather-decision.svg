  <text class="w" x="630" y="214" text-anchor="middle" font-size="22">중단</text>
  <text x="630" y="246" text-anchor="middle" fill="#ffffff" font-size="14" opacity="0.9">특보 · 체온 저하</text>
  <circle cx="400" cy="112" r="16" fill="#1e5f8c"/>
  <text class="s" x="400" y="332" text-anchor="middle">출발 전에 기준을 정해두면 현장에서 무리하지 않는다</text>
