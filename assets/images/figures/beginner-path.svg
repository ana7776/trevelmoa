<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="자전거 여행 초보가 단계별로 거리를 늘려가는 도해">
  <rect width="800" height="400" rx="18" fill="#eef6f2"/>
  <style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{fill:#17201b;font-size:20px;font-weight:700}.s{fill:#60706a;font-size:16px}.w{fill:#ffffff;font-size:16px;font-weight:700}</style>
  <text class="t" x="60" y="62" font-size="24">초보는 거리보다 단계를 늘린다</text>  <line x1="70" y1="210" x2="730" y2="210" stroke="#cfe0d8" stroke-width="8" stroke-linecap="round"/>
  <circle cx="110" cy="210" r="13" fill="#1f6b4f"/>
  <text class="t" x="110" y="180" text-anchor="middle">1단계</text>
  <text class="s" x="110" y="252" text-anchor="middle">왕복 10km</text>
  <circle cx="300" cy="210" r="13" fill="#1f6b4f"/>
  <text class="t" x="300" y="180" text-anchor="middle">2단계</text>
  <text class="s" x="300" y="252" text-anchor="middle">왕복 25km</text>
  <circle cx="490" cy="210" r="13" fill="#1f6b4f"/>
  <text class="t" x="490" y="180" text-anchor="middle">3단계</text>
  <text class="s" x="490" y="252" text-anchor="middle">편도 40km</text>
  <circle cx="690" cy="210" r="13" fill="#1e5f8c"/>
  <text class="t" x="690" y="180" text-anchor="middle">4단계</text>
  <text class="s" x="690" y="252" text-anchor="middle">1박 종주</text>  <text class="s" x="400" y="352" text-anchor="middle">각 단계를 두세 번 반복한 뒤 다음으로 넘어가면 무리가 없다</text>
</svg>
