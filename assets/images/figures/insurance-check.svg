<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="자전거 보험 가입 전 확인할 담보 항목 도해">
  <rect width="800" height="400" rx="18" fill="#eef6f2"/>
  <style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{fill:#17201b;font-size:20px;font-weight:700}.s{fill:#60706a;font-size:16px}.w{fill:#ffffff;font-size:16px;font-weight:700}</style>
  <text class="t" x="60" y="62" font-size="24">보험은 중복부터 확인한다</text>  <rect x="70" y="140" width="200" height="130" rx="16" fill="#1f6b4f"/>
  <text class="w" x="170" y="192" text-anchor="middle" font-size="21">배상책임</text>
  <text x="170" y="226" text-anchor="middle" fill="#ffffff" font-size="14" opacity="0.9">상대 피해 보상</text>
  <rect x="300" y="140" width="200" height="130" rx="16" fill="#1e5f8c"/>
  <text class="w" x="400" y="192" text-anchor="middle" font-size="21">본인상해</text>
  <text x="400" y="226" text-anchor="middle" fill="#ffffff" font-size="14" opacity="0.9">내 부상 보상</text>
  <rect x="530" y="140" width="200" height="130" rx="16" fill="#f5b641"/>
  <text class="w" x="630" y="192" text-anchor="middle" font-size="21">실손 중복</text>
  <text x="630" y="226" text-anchor="middle" fill="#ffffff" font-size="14" opacity="0.9">이미 있는지 확인</text>
  <text class="s" x="400" y="326" text-anchor="middle">지자체 자전거 보험에 이미 가입돼 있는 경우가 많다</text>
</svg>
