<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="여행 중 자전거 고장 유형별 대처 분기 도해">
  <rect width="800" height="400" rx="18" fill="#eef6f2"/>
  <style>text{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif}.t{fill:#17201b;font-size:20px;font-weight:700}.s{fill:#60706a;font-size:16px}.w{fill:#ffffff;font-size:16px;font-weight:700}</style>
  <text class="t" x="60" y="62" font-size="24">현장에서 고칠 것과 포기할 것을 나눈다</text>  <rect x="70" y="145" width="200" height="120" rx="16" fill="#1f6b4f"/>
  <text class="w" x="170" y="196" text-anchor="middle" font-size="22">펑크</text>
  <text x="170" y="228" text-anchor="middle" fill="#ffffff" font-size="14" opacity="0.9">현장 교체 가능</text>
  <rect x="300" y="145" width="200" height="120" rx="16" fill="#1f6b4f"/>
  <text class="w" x="400" y="196" text-anchor="middle" font-size="22">체인 이탈</text>
  <text x="400" y="228" text-anchor="middle" fill="#ffffff" font-size="14" opacity="0.9">현장 복구 가능</text>
  <rect x="530" y="145" width="200" height="120" rx="16" fill="#e0574a"/>
  <text class="w" x="630" y="196" text-anchor="middle" font-size="22">변속 · 휠</text>
  <text x="630" y="228" text-anchor="middle" fill="#ffffff" font-size="14" opacity="0.9">수리점 이동</text>
  <text class="s" x="400" y="320" text-anchor="middle">복구가 안 되면 대중교통 · 콜택시 · 택배 중 이동 대안을 먼저 정한다</text>
</svg>
